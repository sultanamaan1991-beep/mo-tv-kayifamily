name: update-catalog

# Refreshes docs/catalog.json from the public KayiFamily WordPress API.
# Only commits when the catalog actually changed. Never touches the
# playback resolver (tools/build_catalog.py only writes docs/catalog.json).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build catalog (stdlib only)
        run: python3 tools/build_catalog.py

      - name: Commit catalog.json only if changed
        run: |
          if git diff --quiet -- docs/catalog.json; then
            echo "Catalog unchanged; nothing to commit."
          else
            git config user.name "KayiFamily TV catalog bot"
            git config user.email "catalog@kayifamily.local"
            git add docs/catalog.json
            git commit -m "Catalog refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
