name: build-kodi-addon

# Continuous validation for main/PRs. Release packaging happens in
# release.yml (tag builds) so a release ZIP is always produced exactly
# once per release, in a single workflow run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clean Python bytecode before checking
        run: |
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          find . -name "*.pyo" -delete 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest kodi-addon-checker

      - name: Run pytest
        run: python -m pytest tests/ -m "not live" -q

      - name: Run kodi-addon-checker (Nexus)
        run: kodi-addon-checker --branch nexus plugin.video.kayifamily

      - name: Run kodi-addon-checker (Omega)
        run: kodi-addon-checker --branch omega plugin.video.kayifamily

      - name: Package release ZIP (validation only, not published)
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('plugin.video.kayifamily/addon.xml').getroot().attrib['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          rm -f "plugin.video.kayifamily-$VERSION.zip"
          zip -r -q "plugin.video.kayifamily-$VERSION.zip" plugin.video.kayifamily \
            -x "*.pyc" "*__pycache__*" "*.log"
          unzip -l "plugin.video.kayifamily-$VERSION.zip"
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          unzip -o -q "plugin.video.kayifamily-$VERSION.zip" -d /tmp/zipcheck
          test -f /tmp/zipcheck/plugin.video.kayifamily/addon.xml
